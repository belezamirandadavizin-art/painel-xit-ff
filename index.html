
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAINEL XIT FF</title>
<style>
body {
  background:#080808;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:20px;
}
h1 {color:red;}
.card {
  background:#191919;
  border:1px solid red;
  border-radius:12px;
  padding:18px;
  margin:15px 0;
}
button {
  background:red;
  color:white;
  border:0;
  padding:13px;
  border-radius:8px;
  width:100%;
  font-weight:bold;
}
</style>
</head>
<body>
<h1>🔥 PAINEL XIT FF 🔥</h1>
<p>Versão 1.0 Android</p>

<div class="card">
<h3>🎯 Configuração de mira</h3>
<p>Precisão: <span id="v">90</span>%</p>
<input type="range" min="0" max="100"
value="90" oninput="v.innerText=this.value">
</div>

<div class="card">
<h3>⚡ Desempenho</h3>
<p>Configurações e dicas para melhorar seu jogo.</p>
<button onclick="alert('Use gráficos suaves e feche apps em segundo plano!')">
OTIMIZAR DICAS
</button>
</div>

<div class="card">
<h3>🔥 PAINEL XIT FF</h3>
<p>Configurações para melhorar sua jogabilidade.</p>
</div>

</body>
</html>
